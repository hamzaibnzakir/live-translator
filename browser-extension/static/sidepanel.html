<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainbox Translate</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head>
<body class="panel">
<div class="glow"></div>
<div class="app">
<header class="top">
  <img src="icons/icon-48.png" alt="" class="mark">
  <div class="brand"><b>Brainbox</b> <span class="grad">Translate</span></div>
  <span class="chip" id="engine-chip" title="Translation engine status">…</span>
  
  <button class="icon-btn" id="open-options" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
</header>

<nav class="tabs" role="tablist"><button class="on" data-tab="quick" role="tab" aria-selected="true">Translate</button><button data-tab="page" role="tab" aria-selected="false">This page</button></nav>

<section id="tab-quick" class="quick">
  <div class="langbar">
    <select id="from" aria-label="Translate from"></select>
    <button class="icon-btn swap" id="swap" title="Swap languages" aria-label="Swap languages"><svg viewBox="0 0 16 16"><path d="M3 5h9l-2.5-2.5M13 11H4l2.5 2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <select id="to" aria-label="Translate to"></select>
  </div>

  <div class="pane src">
    <textarea id="src" placeholder="Paste or type text in any language…" aria-label="Text to translate"></textarea>
    <div class="pane-foot">
      <span class="tag" id="detected">Auto-detect</span>
      <span class="faint" id="count"></span>
      <span class="grow"></span>
      <button class="ghost small" id="clear" title="Clear">Clear</button>
      <button class="ghost small" id="copy-src">Copy</button>
    </div>
  </div>

  <div class="pane out" id="out-pane">
    <textarea id="out" readonly placeholder="Translation appears here" aria-label="Translation"></textarea>
    <div class="pane-foot">
      <span class="faint" id="engine-line"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> translate &amp; copy</span>
      <span class="grow"></span>
      <button class="ghost small" id="translate">Translate</button>
      <button class="small" id="copy-out">Copy</button>
    </div>
  </div>

  <div class="callout" id="pack-need" hidden></div>
  <div class="callout warn" id="error-box" hidden></div>
</section>

<section id="tab-page" hidden>
  <div class="card">
    <h2>This page</h2>
    <div class="site" id="site-line">…</div>
    <div class="row" style="margin-top:10px"><button id="page-toggle">Translate this page</button><span class="faint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd></span></div>
    <label class="sw"><input type="checkbox" id="site-always"> Always translate this site</label>
    <label class="sw"><input type="checkbox" id="site-never"> Never translate this site</label>
    <div class="hint" id="page-hint"></div>
  </div>
  <div class="card" id="discord-card" hidden>
    <h2>Discord</h2>
    <label class="sw"><input type="checkbox" id="discord-enabled"> Translate messages as I read</label>
    <label class="sw"><input type="checkbox" id="discord-marker"> Show the small dot on translated messages</label>
    <div class="hint">Reply: type in your language, press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd>. Per-server choices are in Settings.</div>
  </div>
</section>

<footer class="foot"><a href="#" id="open-packs">Language packs</a><span class="faint" id="status-line">On-device · nothing leaves your PC</span></footer>
</div>
<div class="toast" id="toast" hidden></div>
<script src="popup.js"></script>
</body>
</html>
